[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-tappo-plus"
dynamic = ["version"]
description = "Third-party Windows enhancements for Wuwa Tappo"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
wuwa-tappo-plus = "wuwa_tappo_plus.entry:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "build==1.6.1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "wuwa_tappo_plus.__version__"}

[tool.setuptools.package-data]
wuwa_tappo_plus = ["scripts/*.js"]
